name: Checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Voice tests detect their own host: synthesis needs macOS `say` and
      # transcription needs a local whisper model, so both skip here rather
      # than fail. Everything else runs.
      - run: npm test
      - run: npm run build
